# dsh-web-notes bundle patch: inserts its plugin row into the web plugin roster.
# The single row mounts BOTH halves: the host side (notes service, disk
# persistence, /api/notes/* routes) and the browser side (the floating note
# dock + panel served from this package's lib/client.js).
# Install into a dsh profile, e.g. `dsh plugin --profile web add link:<this-dir>`
# or `dsh plugin --profile web add dsh-web-notes`.
- insert:
    - id: notes
      name: 'dsh-web-notes'
